name: QA Engineering
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: TypeScript and SQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - name: Validate SQL checks
        run: |
          set -o pipefail
          mkdir -p test-results
          python -m unittest discover -s sql -p 'test_*.py' -v 2>&1 | tee test-results/sql.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-results
          path: test-results/sql.txt
          retention-days: 14
  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CYPRESS_INSTALL_BINARY: '0'
    strategy:
      fail-fast: false
      matrix:
        project: [api, chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        if: matrix.project != 'api'
        run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
