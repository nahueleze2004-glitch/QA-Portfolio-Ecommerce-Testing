name: E-commerce E2E
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cypress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: desktop
            width: 1280
            height: 800
          - viewport: mobile
            width: 390
            height: 844
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run E2E
        run: npm run test:report -- --config viewportWidth=${{ matrix.width }},viewportHeight=${{ matrix.height }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.viewport }}-${{ github.run_attempt }}
          path: |
            reports/
            cypress/screenshots/
            cypress/videos/
          if-no-files-found: warn
          retention-days: 14
